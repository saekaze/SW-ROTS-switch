# XDK 5659 library data layouts the runtime reads or writes (sheroes-nx). Each value is proven by Sonic Heroes'
# default.xbe (title 5345002B, SHA-256 5a963797...29c5c6) code at the address given, disassembled with capstone.
# 5659 keeps 5849's CDevice layout everywhere checked; the differences are noted.
[layout]
# D3D8 CDevice, the static device D3D__pDevice (0x33BC38) points at (0x33BC40, Direct3D_CreateDevice 0x338D13)
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0x32BFB2 reads it, 0x32BFB5 compares with +4, calls MakeSpace 0x32FEC0
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0x32BFB5 compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_DrawIndexedVertices 0x3374BE passes it to the per-draw state flush 0x334FF0
CDevice_IndexBuffer   = 0x7A0   # not referenced in this XBE (no D3DDevice_SetIndices linked); 5849's value, its neighbours (PixelShader 0x784, VertexShader 0x794) agree with 5849
CDevice_ZScale        = 0x948   # the viewport code 0x32D4C6 and the transform setup 0x32E355 scale the Z range by it
CDevice_SuperSampleX  = 0x95C   # D3DDevice_SetViewport 0x32BA22 scales viewport X by it
CDevice_SuperSampleY  = 0x960   # D3DDevice_SetViewport 0x32BA76 scales viewport Y by it
CDevice_Transforms    = 0xC60   # D3DDevice_SetTransform 0x32AF76: lea edi, [ecx + ebx + 0xC60] (type * 64)
CDevice_Textures      = 0xF88   # D3DDevice_SetTexture 0x32BF70 reads, 0x32BFA9 stores [stage]
CDevice_Palettes      = 0xF98   # D3DDevice_SetPalette 0x32C110 reads 0x32C11D and stores 0x32C155 [stage]; the state query 0x32C6C4 reads it
CDevice_RenderTarget  = 0x1A04  # D3DDevice_GetRenderTarget2 0x32B8D6 returns it
CDevice_Depth         = 0x1A08  # D3DDevice_GetDepthStencilSurface2 0x32B8F6 returns it
CDevice_BackBuffer    = 0x1A14  # D3DDevice_GetBackBuffer2 0x32B565 returns [0x1A14 + index * 4]
CDevice_FrontBuffer   = 0x1A18  # D3DDevice_GetBackBuffer2 0x32B55F: index -1 becomes 1; D3DDevice_SetViewport 0x32B935 reads it
CDevice_SwapCount     = 0x2478  # D3DDevice_Swap 0x3387E0 and 0x338820 increment it, 0x33885B returns it
CDevice_Size          = 0x24A0  # Direct3D_CreateDevice 0x338D4B clears 0x928 dwords of the device
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0x338D06-0x338D23 ors BehaviorFlags & 0x10 into [0x33BC48], D3DDevice_SetPixelShader 0x337931 tests that bit
CDevice_Time              = 0x2C   # D3D_SetFence 0x32FB64 reads it; D3DDevice_SetTexture 0x32BF83 stamps resources with it
CDevice_PixelShader       = 0x784  # D3DDevice_SetPixelShader 0x337858 reads, 0x337868 stores the handle
CDevice_VertexShader      = 0x794  # D3DDevice_SetVertexShader 0x32D561 reads the current one
CDevice_BackBufferScale   = 0x96C  # the transform setup 0x32E605 reads the X scale, 0x32E5FF the Y scale at +4
CDevice_Viewport          = 0xEE0  # D3DDevice_SetViewport 0x32BAC0 to 0x32BADA stores X, Y, Width, Height
CDevice_ScreenSpaceOffset = 0xEF8  # D3DDevice_SetScreenSpaceOffset 0x32C603 stores x, 0x32C613 y at +4
CDevice_AutoDepth         = 0x1A20 # D3D_InitDefaultState 0x330257 reads it
# the miniport is at CDevice + 0x1C28 (D3DDevice_SetGammaRamp 0x32AEB3); its fields as in 5849
CDevice_VBlankCallback    = 0x1DB8 # the vertical blank handler 0x33259E reads [miniport + 0x190]
CDevice_VBlankEvent       = 0x1DBC # D3DDevice_BlockUntilVerticalBlank 0x32B117 waits on it, 0x32B10B clears its SignalState (+4)
CDevice_DisplayFlags      = 0x1DDC # D3DDevice_GetDisplayFieldStatus 0x32C1E2 tests it; the mode set 0x331D3F stores [miniport + 0x1B4]
CDevice_VBlankCount       = 0x1DE8 # the vertical blank handler 0x332501 stores [miniport + 0x1C0]; 0x32C1D5 reads it
CDevice_Field             = 0x1DF8 # the vertical blank handler 0x33235B stores [miniport + 0x1D0]; 0x32C1EF reads it
CDevice_GammaRamps        = 0x1E04 # D3DDevice_SetGammaRamp 0x32AEE3 copies to miniport + 0x1DC + index * 0x300
# CDevice_GammaPending: not given. 5659's SetGammaRamp (0x32AEFA) stores the ramp index at [miniport + 0x7E4]
# instead of 5849's flag per index, so the Swap HLE's pending-ramp check does not apply (it skips when unknown).
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0x32BFE7 ors it into D3D__DirtyFlags (0x33B798)
TextureState_Stage    = 32      # D3DDevice_SetTextureStageStateNotInline 0x32E17B: [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource 0x32D0FA indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0x32D142 stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0x32D148 stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_SetPixelShader 0x3378D0 reads the definition pointer at handle + 8
# DSOUND
# CDirectSoundStream_Vtable, CDirectSoundStream_Vtable2: not given (no DirectSound streams found in this XBE)
EffectsImage_Skip0    = 0x804   # 0x341773 adds this dword count
EffectsImage_Skip1    = 0x80C   # 0x34176D loads this dword count
EffectsImage_Desc     = 0x818   # 0x34177C: descriptor at image + 0x818 + (Skip0 + Skip1) * 4
# XAPI XPP device type record (the same in 5233 and 5849)
XPP_Current           = 0x0
XPP_Changed           = 0x4
XPP_Previous          = 0x8
